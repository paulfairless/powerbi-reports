name: Deploy Power BI Reports

on:
  workflow_dispatch:
    inputs:
      customer:
        description: 'The customer to deploy for'
        required: true
        type: choice
        options:
          - customerA
          - customerB
      environment:
        description: 'The environment to deploy to'
        required: true
        type: choice
        options:
          - developer
          - customer

jobs:
  deploy:
    name: "Deploy to ${{ github.event.inputs.customer }} (${{ github.event.inputs.environment }})"
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up environment variables for secrets
        id: set_secrets
        env:
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
        run: |
          # Construct the dynamic secret names
          CUSTOMER_UPPER=$(echo "${{ github.event.inputs.customer }}" | tr 'a-z' 'A-Z')
          ENV_UPPER=$(echo "${{ github.event.inputs.environment }}" | tr 'a-z' 'A-Z')

          MAIN_APP_ID_SECRET_NAME="APP_ID_${ENV_UPPER}"
          MAIN_APP_SECRET_SECRET_NAME="APP_SECRET_${ENV_UPPER}"
          DS_APP_ID_SECRET_NAME="DATASOURCE_SP_APP_ID_${CUSTOMER_UPPER}_${ENV_UPPER}"
          DS_APP_SECRET_SECRET_NAME="DATASOURCE_SP_APP_SECRET_${CUSTOMER_UPPER}_${ENV_UPPER}"

          # Use jq to look up the secret values from the context
          MAIN_APP_ID_VALUE=$(echo $SECRETS_CONTEXT | jq -r ".${MAIN_APP_ID_SECRET_NAME}")
          MAIN_APP_SECRET_VALUE=$(echo $SECRETS_CONTEXT | jq -r ".${MAIN_APP_SECRET_SECRET_NAME}")
          DS_APP_ID_VALUE=$(echo $SECRETS_CONTEXT | jq -r ".${DS_APP_ID_SECRET_NAME}")
          DS_APP_SECRET_VALUE=$(echo $SECRETS_CONTEXT | jq -r ".${DS_APP_SECRET_SECRET_NAME}")

          # Export secrets as environment variables for the next step
          echo "MAIN_APP_ID=$MAIN_APP_ID_VALUE" >> $GITHUB_ENV
          echo "MAIN_APP_SECRET=$MAIN_APP_SECRET_VALUE" >> $GITHUB_ENV
          # The PowerShell script expects the datasource secrets to be named after the value in config.json
          echo "$DS_APP_ID_SECRET_NAME=$DS_APP_ID_VALUE" >> $GITHUB_ENV
          echo "$DS_APP_SECRET_SECRET_NAME=$DS_APP_SECRET_VALUE" >> $GITHUB_ENV

      - name: Deploy Power BI Reports
        uses: azure/powershell@v1
        with:
          inlineScript: |
            ./scripts/Deploy-PowerBIReports.ps1 `
              -TenantId "${{ secrets.TENANT_ID }}" `
              -AppId "${{ env.MAIN_APP_ID }}" `
              -AppSecret "${{ env.MAIN_APP_SECRET }}" `
              -CustomerName "${{ github.event.inputs.customer }}" `
              -Environment "${{ github.event.inputs.environment }}"
          errorActionPreference: "stop"
          failOnStandardError: true
