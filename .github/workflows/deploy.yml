name: Deploy Power BI Reports

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-non-prod:
    name: "Deploy to Non-Prod"
    runs-on: ubuntu-latest
    environment: non-prod
    defaults:
      run:
        working-directory: ./terraform/environments/non-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.2.0

      - name: Terraform Init
        id: init
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID_NON_PROD }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET_NON_PROD }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID_NON_PROD }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID_NON_PROD }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID_NON_PROD }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET_NON_PROD }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID_NON_PROD }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID_NON_PROD }}
        run: terraform plan -no-color

      - name: Terraform Apply
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID_NON_PROD }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET_NON_PROD }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID_NON_PROD }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID_NON_PROD }}
        run: terraform apply -auto-approve

  deploy-prod:
    name: "Deploy to Prod"
    runs-on: ubuntu-latest
    needs: deploy-non-prod
    environment:
      name: prod
      url: your-prod-environment-url # Optional
    defaults:
      run:
        working-directory: ./terraform/environments/prod

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.2.0

      - name: Terraform Init
        id: init
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID_PROD }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET_PROD }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID_PROD }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID_PROD }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID_PROD }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET_PROD }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID_PROD }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID_PROD }}
        run: terraform plan -no-color

      - name: Terraform Apply
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID_PROD }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET_PROD }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID_PROD }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID_PROD }}
        run: terraform apply -auto-approve
